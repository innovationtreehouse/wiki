port: 3000
bindIP: 0.0.0.0
db:
  type: $(DB_TYPE)
  host: '$(DB_HOST)'
  port: $(DB_PORT)
  user: '$(DB_USER)'
  pass: '$(DB_PASS)'
  db: $(DB_NAME)
  storage: $(DB_FILEPATH)
  ssl: $(DB_SSL)
  sessionCleanupInterval: $(DB_SESSION_CLEANUP_INTERVAL:60000)
  healthCheckInterval: $(DB_HEALTH_CHECK_INTERVAL:14400000)
pool:
  min: $(DB_POOL_MIN:2)
ssl:
  enabled: $(SSL_ACTIVE)
  port: 3443
  provider: letsencrypt
  domain: $(LETSENCRYPT_DOMAIN)
  subscriberEmail: $(LETSENCRYPT_EMAIL)
logLevel: $(LOG_LEVEL:info)
logFormat: $(LOG_FORMAT:default)
ha: $(HA_ACTIVE)
nav:
  cacheTTL: $(NAV_CACHE_TTL:3600)
analytics:
  cacheTTL: $(ANALYTICS_CACHE_TTL:86400)
auth:
  userCacheTTL: $(AUTH_USER_CACHE_TTL:14400)
  guestCacheTTL: $(AUTH_GUEST_CACHE_TTL:3600)
